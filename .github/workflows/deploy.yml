name: CI/CD Pipeline

# ============================================================
# Git Branching Strategy (single EC2 — production only):
#
#   feature/xxx  →  PR →  dev  →  PR →  main (production)
#
#   - feature/*    : daily development, push freely (lint & test)
#   - dev          : integration branch (lint & test, no deploy)
#   - main         : production, deploys to the EC2 instance
#
# Workflow:
#   1. Create feature branch:  git checkout -b feature/add-payment
#   2. Develop & push:         git push origin feature/add-payment
#   3. Open PR → dev:          triggers lint & test
#   4. Merge to dev:           triggers lint & test (integration check)
#   5. Open PR → main:         triggers lint & test again
#   6. Merge to main:          triggers build + deploy to production
# ============================================================

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main, dev]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ==================== Lint & Test (runs on everything) ====================
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Lint backend
        working-directory: ./backend
        run: npm run lint --if-present

      - name: Run backend tests
        working-directory: ./backend
        run: npm test --if-present

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Lint frontend
        working-directory: ./frontend
        run: npm run lint --if-present

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  # ==================== Build Docker Images ====================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    # Only build on push to main (production); PRs, dev and feature branches skip
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Determine image tag
        id: tag
        run: |
          echo "env_tag=production" >> $GITHUB_OUTPUT
          echo "image_prefix=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          target: production
          tags: |
            ${{ env.REGISTRY }}/${{ steps.tag.outputs.image_prefix }}-${{ matrix.service }}:${{ steps.tag.outputs.env_tag }}
            ${{ env.REGISTRY }}/${{ steps.tag.outputs.image_prefix }}-${{ matrix.service }}:${{ github.sha }}

  # ==================== Deploy to Production (main only) ====================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Fail the job if any command in the script fails (no more false green)
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/sim-card-shop

            # Git may refuse the repo if it is owned by another user
            git config --global --add safe.directory /opt/sim-card-shop
            git pull origin main

            # Log in to GHCR with the workflow's own token (no long-lived secret)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull pre-built images and (re)start services
            docker compose -f docker-compose.pull.yml pull
            docker compose -f docker-compose.pull.yml up -d --remove-orphans

            # Apply schema changes if any
            sleep 10
            docker exec simcard_backend npx prisma db push --skip-generate 2>/dev/null || true

            docker image prune -f
            echo "✅ Production deployed at $(date)"
